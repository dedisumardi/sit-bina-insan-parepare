<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <!-- Crest Icon -->
  <g transform="translate(10, 10)">
    <!-- Outer Octagram/Star Shield -->
    <rect x="5" y="5" width="50" height="50" rx="12" fill="#002f9b" transform="rotate(45 30 30)" opacity="0.15"/>
    <rect x="7" y="7" width="46" height="46" rx="10" fill="#002f9b"/>
    <rect x="9" y="9" width="42" height="42" rx="8" stroke="#f59e0b" stroke-width="1.5" fill="none"/>
    
    <!-- Open Book (Al-Qur'an) -->
    <path d="M19 36C23 33 27 34 30 36C33 34 37 33 41 36V23C37 20 33 21 30 23C27 21 23 20 19 23Z" fill="#ffffff"/>
    <path d="M30 23V36" stroke="#002f9b" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="22" y1="26" x2="28" y2="28" stroke="#2563eb" stroke-width="1" stroke-linecap="round"/>
    <line x1="22" y1="29" x2="28" y2="31" stroke="#2563eb" stroke-width="1" stroke-linecap="round"/>
    <line x1="32" y1="28" x2="38" y2="26" stroke="#2563eb" stroke-width="1" stroke-linecap="round"/>
    <line x1="32" y1="31" x2="38" y2="29" stroke="#2563eb" stroke-width="1" stroke-linecap="round"/>
    
    <!-- Star of Excellence & Crescent subtle motif -->
    <circle cx="30" cy="16" r="3" fill="#fbbf24"/>
    <path d="M28 42C29.2 42.6 30.8 42.6 32 42" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Typography -->
  <g transform="translate(78, 18)">
    <text x="0" y="16" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#002f9b" letter-spacing="2">SEKOLAH ISLAM TERPADU</text>
    <text x="0" y="38" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#0f172a" letter-spacing="0.5">BINA INSAN</text>
    <text x="142" y="38" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#d97706" letter-spacing="1">PAREPARE</text>
    <text x="0" y="52" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#64748b" letter-spacing="0.8">QUR'ANI • CERDAS • BERAKHLAK MULIA</text>
  </g>
</svg>
